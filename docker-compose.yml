services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_HOST_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - hugme-network

  paradedb:
    image: paradedb/paradedb:0.24.3-pg17
    environment:
      POSTGRES_DB: ${CHATBOT_POSTGRES_DB}
      POSTGRES_USER: ${CHATBOT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CHATBOT_POSTGRES_PASSWORD}
    ports:
      - '${CHATBOT_POSTGRES_HOST_PORT}:5432'
    volumes:
      - paradedb-data:/var/lib/postgresql/data
    networks:
      - hugme-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms1g -Xmx1g'
    ports:
      - '${ELASTICSEARCH_HOST_PORT}:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - hugme-network

  backend:
    profiles:
      - app
    build:
      context: ../Backend_Hugme
      dockerfile: Dockerfile
    image: hugme-local-backend
    networks:
      - hugme-network

  ai:
    profiles:
      - app
    build:
      context: ../AI_Hugme
      dockerfile: Dockerfile
    image: hugme-local-ai
    networks:
      - hugme-network

networks:
  hugme-network:
    driver: bridge

volumes:
  postgres-data:
  paradedb-data:
  elasticsearch-data:
  ai-models:
